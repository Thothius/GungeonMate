<!DOCTYPE html>
<!-- Codex — category grid · source: lib/screens/codex_screen.dart (_buildCategoryGrid) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Codex — Categories — Design Lab</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<style>
  .codex-search { padding: 8px 14px 4px; }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    padding: 10px 14px 24px;
  }
  /* codex_widgets.dart:281 — below 360dp the grid drops to 3 columns */
  @container (max-width: 359px) {
    .cat-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .cat-tile {
    aspect-ratio: 0.9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(180deg, var(--flair-card), #0e0e0e);
    border: 0.8px solid rgba(224,224,224,0.12);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .cat-tile .cat-ico {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .cat-tile .cat-name {
    font-size: var(--fs-label-sm);
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.4px;
    color: var(--flair-primary);
    padding: 0 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-tile .cat-count {
    font-size: 9px;
    color: var(--flair-secondary);
    font-weight: 700;
  }
  .cat-tile.special { border-color: rgba(224,224,224,.3); }
  .accent-gungeoneers { color: var(--codex-gungeoneers); }
  .accent-npcs        { color: var(--codex-npcs); }
  .accent-enemies     { color: var(--codex-enemies); }
  .accent-bosses      { color: var(--codex-bosses); }
  .accent-pickups     { color: var(--codex-pickups); }
  .accent-objects     { color: var(--codex-objects); }
  .accent-rat         { color: var(--codex-rat); }
  .accent-dragun      { color: var(--codex-dragun); }
  .accent-hell        { color: var(--codex-bullet-hell); }
  .accent-challenge   { color: var(--codex-challenge); }
</style>
</head>
<body>
<div class="lab-stage">
  <div class="phone-frame">
    <div class="frame-tag"></div>
    <div class="screen">
      <div class="appbar">
        <span class="back">&#8592;</span>
        <span class="title">Ammonomicon</span>
        <span class="spacer"></span>
      </div>

      <div class="codex-search">
        <div class="appbar" style="height:auto;padding:0">
          <div class="search-field"><span>&#9906;</span>Search the Ammonomicon…</div>
        </div>
      </div>

      <div class="cat-grid">
        <div class="cat-tile special"><span class="cat-ico accent-gungeoneers">&#9821;</span><span class="cat-name">Gungeoneers</span><span class="cat-count">10</span></div>
        <div class="cat-tile"><span class="cat-ico accent-npcs">&#9786;</span><span class="cat-name">NPCs</span><span class="cat-count">34</span></div>
        <div class="cat-tile"><span class="cat-ico accent-enemies">&#9760;</span><span class="cat-name">Enemies</span><span class="cat-count">146</span></div>
        <div class="cat-tile"><span class="cat-ico accent-bosses">&#9819;</span><span class="cat-name">Bosses</span><span class="cat-count">26</span></div>
        <div class="cat-tile"><span class="cat-ico accent-pickups">&#10026;</span><span class="cat-name">Pickups</span><span class="cat-count">52</span></div>
        <div class="cat-tile"><span class="cat-ico accent-objects">&#9636;</span><span class="cat-name">Objects</span><span class="cat-count">88</span></div>
        <div class="cat-tile"><span class="cat-ico accent-gungeoneers">&#9876;</span><span class="cat-name">Guns</span><span class="cat-count">239</span></div>
        <div class="cat-tile"><span class="cat-ico accent-pickups">&#8902;</span><span class="cat-name">Items</span><span class="cat-count">270</span></div>
        <div class="cat-tile"><span class="cat-ico accent-rat">&#9928;</span><span class="cat-name">Rat</span><span class="cat-count">12</span></div>
        <div class="cat-tile"><span class="cat-ico accent-dragun">&#128009;</span><span class="cat-name">Dragun</span><span class="cat-count">8</span></div>
        <div class="cat-tile"><span class="cat-ico accent-hell">&#9762;</span><span class="cat-name">Bullet Hell</span><span class="cat-count">19</span></div>
        <div class="cat-tile"><span class="cat-ico accent-challenge">&#9873;</span><span class="cat-name">Challenge</span><span class="cat-count">26</span></div>
      </div>
    </div>
  </div>
</div>
<script src="../lab.js"></script>
</body>
</html>
